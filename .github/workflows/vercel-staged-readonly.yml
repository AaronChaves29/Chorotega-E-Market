name: Vercel existing staged verification (disabled pending OIDC approval)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Verificar únicamente el deployment existente; no crea ni promueve
        type: string
        required: true
        default: ''

permissions:
  contents: read

jobs:
  verify_existing:
    name: Verify existing staged (read only, disabled)
    if: ${{ false && github.repository == 'AaronChaves29/Chorotega-E-Market' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.confirmation == '[verify-vercel-staged:dpl_2RA5JfKczFobQfTwmLPqQV8RrBRB]' }}
    environment:
      name: vercel-staged-approval
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: chorotega-production
      cancel-in-progress: false
    env:
      # Fijar el nuevo verificador integrado y con CI aprobado; 0707586 no lo contiene.
      VERIFY_CODE_SHA: '0000000000000000000000000000000000000000'
      # Solo cambiar tras autorizar y comprobar manualmente la regla Trusted Sources.
      VERIFY_TRUST_CONFIGURED: 'false'
      VERIFY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Rechazar preparación incompleta
        run: |
          [[ "$VERIFY_CODE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$VERIFY_CODE_SHA" != "0000000000000000000000000000000000000000" || exit 1
          test "$VERIFY_TRUST_CONFIGURED" = "true" || exit 1
      - name: Obtener únicamente el verificador revisado
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFY_CODE_SHA }}
          path: validator
          fetch-depth: 0
          persist-credentials: false
      - name: Comprobar pertenencia a develop
        working-directory: validator
        run: git merge-base --is-ancestor "$VERIFY_CODE_SHA" "$GITHUB_SHA"
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exigir CI del nuevo verificador antes de Secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          async function get(path) {
            const response = await fetch(`https://api.github.com/repos/AaronChaves29/Chorotega-E-Market/${path}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
              redirect: 'error', signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error();
            return response.json();
          }
          try {
            const sha = process.env.VERIFY_CODE_SHA;
            const runs = await get(`actions/runs?head_sha=${sha}&branch=develop&event=push&per_page=100`);
            if (!Array.isArray(runs.workflow_runs) || !Number.isSafeInteger(runs.total_count) ||
                runs.total_count !== runs.workflow_runs.length) throw new Error();
            const candidates = runs.workflow_runs.filter((item) => item.path === '.github/workflows/ci.yml');
            if (!candidates.every((item) => Number.isSafeInteger(item.id) && item.id > 0)) throw new Error();
            const run = candidates.sort((a, b) => b.id - a.id)[0];
            if (!run || run.head_sha !== sha || run.head_branch !== 'develop' || run.event !== 'push' ||
                run.status !== 'completed' || run.conclusion !== 'success') throw new Error();
            const jobs = await get(`actions/runs/${run.id}/jobs?filter=latest&per_page=100`);
            if (!Array.isArray(jobs.jobs) || !Number.isSafeInteger(jobs.total_count) || jobs.total_count !== jobs.jobs.length ||
                !['Build Backend', 'Build Frontend'].every((name) => jobs.jobs.some((job) =>
                  job.name === name && job.status === 'completed' && job.conclusion === 'success'))) throw new Error();
            console.log('CI del nuevo verificador: OK');
          } catch {
            console.error('No se acreditó CI del nuevo verificador. No se accederá a Secrets.');
            process.exitCode = 1;
          }
          NODE
      - name: Verificar por GET el deployment existente con OIDC
        working-directory: validator
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ci/vercel-staged-readonly.mjs
