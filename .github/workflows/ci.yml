name: CI - Chorotega E-Market

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chorotega_ci
      DATABASE_SSL: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chorotega_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chorotega_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Compilar backend
        run: npm run build

      - name: Verificar artefacto compilado
        run: npm run test:deployment

      - name: Verificar orquestación de despliegue sin red ni credenciales
        run: node --test ../../scripts/ci/production-deploy.test.mjs

      - name: Ejecutar migraciones
        run: npm run migration:run

      - name: Mostrar historial de migraciones
        run: npm run migration:show

      - name: Cargar datos de ejemplo
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -X -U postgres -d chorotega_ci \
            -v ON_ERROR_STOP=1 --single-transaction -f - \
            < ../../database/postgres/seeds/V1__seed_initial_data.sql

      - name: Ejecutar pruebas unitarias y cobertura de negocio
        run: npm run test:cov -- --runInBand --json --outputFile=coverage/jest-unit-results.json

      - name: Ejecutar pruebas de integración con Testcontainers
        run: npm run test:integration -- --json --outputFile=coverage/jest-integration-results.json

      - name: Verificar formularios MVC en Chrome con PostgreSQL temporal
        run: npm run test:browser

      - name: Publicar cobertura y resultados de Jest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-and-test-results
          path: |
            apps/backend/coverage/jest-unit-results.json
            apps/backend/coverage/jest-integration-results.json
            apps/backend/coverage/coverage-summary.json
            apps/backend/coverage/lcov.info
            apps/backend/coverage/index.html
            apps/backend/coverage/*.css
            apps/backend/coverage/*.js
            apps/backend/coverage/*.png
            apps/backend/coverage/orders/
            apps/backend/coverage/deliveries/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  # Retirar false únicamente después de configurar Secrets y bloquear
  # el auto-deploy Git de main en Vercel. No ejecutar desde PR.
  deploy:
    name: Deploy production (disabled)
    needs: [backend, frontend]
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: chorotega-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Obtener el SHA aprobado
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configurar Node.js para Vercel
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validar configuración antes de cualquier despliegue
        run: node scripts/ci/production-deploy.mjs preflight
      - name: Instalar CLI oficial fijada
        run: npm install --global vercel@65.4.0
      - name: Preparar build Vercel desde la raíz del monorepo
        run: node scripts/ci/production-deploy.mjs vercel-build
      - name: Desplegar Render y esperar SHA live y health
        run: node scripts/ci/production-deploy.mjs render
      - name: Publicar Vercel prebuilt y comprobar frontend
        run: node scripts/ci/production-deploy.mjs vercel-deploy
