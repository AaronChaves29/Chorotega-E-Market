name: CI - Chorotega E-Market

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chorotega_ci
      DATABASE_SSL: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chorotega_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chorotega_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Compilar backend
        run: npm run build

      - name: Verificar artefacto compilado
        run: npm run test:deployment

      - name: Ejecutar migraciones
        run: npm run migration:run

      - name: Mostrar historial de migraciones
        run: npm run migration:show

      - name: Cargar datos de ejemplo
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -X -U postgres -d chorotega_ci \
            -v ON_ERROR_STOP=1 --single-transaction -f - \
            < ../../database/postgres/seeds/V1__seed_initial_data.sql

      - name: Ejecutar pruebas unitarias y cobertura de negocio
        run: npm run test:cov -- --runInBand --json --outputFile=coverage/jest-unit-results.json

      - name: Ejecutar pruebas de integración con Testcontainers
        run: npm run test:integration -- --json --outputFile=coverage/jest-integration-results.json

      - name: Verificar formularios MVC en Chrome con PostgreSQL temporal
        run: npm run test:browser

      - name: Publicar cobertura y resultados de Jest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-and-test-results
          path: |
            apps/backend/coverage/jest-unit-results.json
            apps/backend/coverage/jest-integration-results.json
            apps/backend/coverage/coverage-summary.json
            apps/backend/coverage/lcov.info
            apps/backend/coverage/index.html
            apps/backend/coverage/*.css
            apps/backend/coverage/*.js
            apps/backend/coverage/*.png
            apps/backend/coverage/orders/
            apps/backend/coverage/deliveries/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  # Bloqueado hasta confirmar el mecanismo real de Render y Vercel.
  # No retirar false hasta implementar y revisar ambos despliegues.
  deploy:
    name: Deploy production (disabled)
    needs: [backend, frontend]
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Bloqueo de despliegue pendiente de configuración externa
        run: |
          echo "::error::Confirmar integración de Render/Vercel y GitHub Secrets antes de habilitar producción."
          exit 1
